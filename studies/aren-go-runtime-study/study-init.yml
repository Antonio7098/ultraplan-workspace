name: aren-go-runtime-study
description: "Evidence study of elite Go repositories for Aren's roadmap, ordered from the Phase 1 lifecycle contract through providers, tools, bounded agents, persistence, hosting, workflows, and later execution seams."
repos:
  count: 9
  items:
    - name: conc
      url: "https://github.com/sourcegraph/conc"
      description: "Compact structured-concurrency library whose small surface makes goroutine ownership, cancellation, panic propagation, bounded pools, and composition easy to inspect in full."
      applicable_dimensions:
        - "01.01"
        - "01.02"
        - "01.03"
        - "01.11"
    - name: crush
      url: "https://github.com/charmbracelet/crush"
      description: "Production Go coding agent with provider adapters, streaming sessions, tool permissions, MCP and LSP integration, context management, and SQLite-backed session state."
      applicable_dimensions:
        - "01.01"
        - "01.04"
        - "01.05"
        - "01.06"
        - "01.08"
    - name: docker-agent
      url: "https://github.com/docker/docker-agent"
      description: "Go agent builder and runtime from Docker with multiple providers, MCP and built-in tools, sandboxing, permissions, structured output, multi-agent composition, and server sessions."
      applicable_dimensions:
        - "01.02"
        - "01.04"
        - "01.05"
        - "01.06"
        - "01.07"
        - "01.08"
        - "01.11"
    - name: ollama
      url: "https://github.com/ollama/ollama"
      description: "Widely deployed Go model server with live response streaming, request cancellation, model scheduling, bounded loading, resource accounting, and a long-lived local API."
      applicable_dimensions:
        - "01.02"
        - "01.04"
        - "01.09"
        - "01.12"
        - "01.13"
    - name: runc
      url: "https://github.com/opencontainers/runc"
      description: "Reference OCI runtime implementation in Go, selected for process lifecycle, signal forwarding, namespace and cgroup containment, descendant cleanup, and executor boundaries."
      applicable_dimensions:
        - "01.02"
        - "01.03"
        - "01.07"
        - "01.15"
    - name: nats-server
      url: "https://github.com/nats-io/nats-server"
      description: "Mature Go server selected for ordered event delivery, slow-consumer handling, bounded queues, JetStream persistence, restart behaviour, and graceful server ownership."
      applicable_dimensions:
        - "01.03"
        - "01.04"
        - "01.09"
        - "01.10"
        - "01.13"
    - name: pebble
      url: "https://github.com/cockroachdb/pebble"
      description: "Production Go storage engine selected for WAL and commit behaviour, checkpoints, recovery, format evolution, fault injection, metamorphic testing, and bounded storage work."
