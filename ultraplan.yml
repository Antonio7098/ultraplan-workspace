version: 1
runtime:
  default: opencode
models:
  default: openrouter/stealth/ox-alpha
  primary: openrouter/stealth/ox-alpha
  backup: openrouter/stealth/ox-alpha
execution:
  default_variant: high
  default_parallel: 5
  default_timeout: 12m
  default_retries: 1
planning:
  requirements_model: openrouter/stealth/ox-alpha
  requirements_variant: high
  code_context_model: openrouter/stealth/ox-alpha
  code_context_variant: low
  sprint_index_model: openrouter/stealth/ox-alpha
  sprint_index_variant: high
  technical_handbook_model: openrouter/stealth/ox-alpha
  technical_handbook_variant: high
  area_reasoning_model: openrouter/stealth/ox-alpha
  area_reasoning_variant: high
  reasoning_model: openrouter/stealth/ox-alpha
  reasoning_variant: high
  plan_model: openrouter/stealth/ox-alpha
  plan_variant: high
  review_model: openrouter/stealth/ox-alpha
  smoke_model: openrouter/stealth/ox-alpha
  smoke_variant: low
  execute_model: openrouter/stealth/ox-alpha
  execute_variant: high
logging:
  format: text
  level: debug
agentwrap:
  executable: opencode
  permission_default: allow
  required_health:
    - runtime_available
    - structured_output
    - workdir
